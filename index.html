<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vamp</title>
<meta name="description" content="Play R&B, neo-soul, disco and house chords with your fingers, and share them as MIDI.">
<meta name="theme-color" content="#fafafb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vamp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout : écran de jeu d'abord — accord joué + son en cours, suite de 4 touches, panneau son (choix + réglages côte à côte),
   puis style et tonalité, autres accords, mémoires. Trois habillages au choix via data-design sur la racine. */
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --ink: #1d1e22;
  --muted: #6b6d74;
  --line: #2a2b30;
  --rule: #d5d7dd;
  --accent: #2f4fd8;
  --accent-soft: #eef1fc;
  --press: #1d1e22;
  --press-ink: #ffffff;
  --suite-bg: #2f4fd8;
  --suite-line: #2f4fd8;
  --suite-ink: #ffffff;
  --suite-sub: #cdd5f8;
  --held-suite-bg: #1d1e22;
  --held-suite-ink: #ffffff;
  --radius: 8px;
  --radius-ctl: 6px;
  --radius-btn: 4px;
  --bw: 1.5px;
  --display-weight: 700;
  --display-track: -0.045em;
  --font: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 640px; margin: 0 auto; padding-block: 10px 32px; display: flex; flex-direction: column; gap: 18px; }
.label { margin: 0 0 8px; font-size: 0.78rem; font-weight: 500; color: var(--muted); }
.gap-top { margin-top: 10px; }


/* Accord joué à gauche, 4 commandes du son à droite */
.now { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.now-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, 92px); gap: 6px; }
.tile { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 6px 8px 7px; border: var(--bw) solid var(--rule); border-radius: 6px; background: var(--surface); }
.tile-top { display: flex; justify-content: space-between; align-items: baseline; gap: 2px; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
.tile-top output { font-family: var(--mono); font-size: 0.68rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; }
.tile input[type="range"] { width: 100%; min-width: 0; margin: 0; height: 20px; accent-color: var(--accent); }
.tile.instru { background: var(--ink); border-color: var(--ink); position: relative; }
.tile.instru .tile-top { color: #b9bbc4; }
.tile.instru select { -webkit-appearance: none; appearance: none; width: 100%; border: 0; padding: 0 14px 0 0; margin: 0; background: transparent; color: #fff; font: 600 0.95rem var(--font); line-height: 20px; cursor: pointer; }
.tile.instru select:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.tile.instru::after { content: ""; position: absolute; right: 9px; bottom: 13px; width: 6px; height: 6px; border-right: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(45deg); pointer-events: none; }
.tile.instru option { color: #1d1e22; }
@media (max-width: 359px) { .tiles { grid-template-columns: repeat(2, 80px); gap: 5px; } .tile { padding: 5px 5px 6px; } .tile-top { font-size: 0.54rem; letter-spacing: 0; } .tile-top output { font-size: 0.6rem; } }
/* Accord joué : tailles */
.now-name { font-size: clamp(2.1rem, 11vw, 3.5rem); font-weight: var(--display-weight); line-height: 0.95; letter-spacing: var(--display-track); overflow-wrap: anywhere; min-width: 0; }
.now-name.idle { color: var(--muted); font-size: clamp(1.3rem, 6.4vw, 2rem); letter-spacing: -0.02em; }
.sound-tag { flex: none; margin-top: 4px; font-family: var(--mono); font-size: 0.78rem; padding: 5px 10px; border-radius: 999px; border: var(--bw) solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.sound-tag::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 1px; }
.notes.idle .note { color: var(--muted); }
.notes { display: flex; flex-wrap: wrap; gap: 5px; min-height: 26px; }
.note { font-family: var(--mono); font-size: 0.78rem; padding: 3px 7px; border-radius: 999px; background: var(--surface); border: var(--bw) solid var(--line); }
.note.root { border-color: var(--accent); color: var(--accent); }

/* Sélecteurs */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--radius-ctl); overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; border: 0; background: transparent; color: var(--muted); border-radius: var(--radius-btn); padding: 8px 10px; font-size: 0.9rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg.grid { display: grid; overflow: visible; }
.seg.grid button { padding: 8px 0; min-width: 0; }
.styles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.keyrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.keys { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.keys button { font-size: 0.86rem; padding: 6px 0; }
.seg.modes { flex-direction: column; }
.seg.modes button { flex: 1 1 0; padding: 4px 12px; }
.controls { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 359px) { .styles button, .sounds button { font-size: 0.8rem; } .note { padding: 3px 7px; font-size: 0.76rem; } }

/* Panneau son : choix du son et ses réglages ensemble */
.soundpanel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--radius); padding: 6px 6px 12px; display: flex; flex-direction: column; gap: 10px; }
.soundpanel .seg { border: 0; padding: 0; background: transparent; }
.sounds { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.sounds button { font-size: 0.86rem; }
.sound { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 6px; }
.sl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sl-top { display: flex; justify-content: space-between; gap: 6px; font-size: 0.74rem; color: var(--muted); }
.sl-top output { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.sl input { width: 100%; min-width: 0; margin: 0; accent-color: var(--accent); }

/* Touches */
.pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 520px) { .pads { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pad {
  position: relative; border: var(--bw) solid var(--line); background: var(--surface); border-radius: var(--radius);
  min-height: 74px; padding: 11px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  transition: background .08s, color .08s, transform .08s, box-shadow .08s;
}
.pad .ch { display: flex; flex-wrap: wrap; align-items: baseline; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.12; }
.pad .ch b { font-weight: 600; white-space: nowrap; }
.pad .ch i { font-style: normal; font-weight: 500; font-size: 0.86em; white-space: nowrap; }
.pad .rn { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); overflow-wrap: anywhere; }
.pad .num { font-family: var(--mono); font-size: 0.72rem; font-weight: 500; color: var(--accent); }
.pad.held { background: var(--press); color: var(--press-ink); border-color: var(--press); transform: scale(0.97); }
.pad.held .rn { color: inherit; opacity: .7; }
.pads.suite { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pads.suite .pad { background: var(--suite-bg); color: var(--suite-ink); border: calc(var(--bw) + 0.5px) solid var(--suite-line); min-height: 100px; padding: 9px 10px; gap: 4px; }
.pads.suite .pad .ch { font-size: clamp(0.86rem, 4.4vw, 1.15rem); }
.pads.suite .pad .rn, .pads.suite .pad .num { color: var(--suite-sub); }
.pads.suite .pad .rn { font-size: 0.66rem; }
.pads.suite .pad.held { background: var(--held-suite-bg); border-color: var(--held-suite-bg); color: var(--held-suite-ink); }
.pads.suite .pad.held .rn, .pads.suite .pad.held .num { color: var(--held-suite-ink); opacity: 1; }
@media (max-width: 359px) { .pads.suite .pad { padding: 8px 7px; } .pads.suite .pad .ch i { font-size: 0.8em; } }

/* Barre fixe */
.bar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; gap: 8px; padding: 8px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: calc(var(--radius) + 2px); box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.bar button { border: 0; border-radius: var(--radius-btn); padding: 14px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; }
.bar button:active { transform: scale(0.98); }
#gen { flex: 1; background: var(--accent); color: #fff; }
#share { flex: none; display: inline-flex; align-items: center; gap: 7px; background: var(--bg); color: var(--ink); border: var(--bw) solid var(--line); }
.share-ico { width: 18px; height: 18px; }
.link { border: 0; background: none; padding: 6px 0; font-size: 0.88rem; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link:disabled { opacity: .4; cursor: default; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.prow .label { margin: 0; }
.prow .seg button { padding: 6px 12px; flex: 0 0 auto; }


/* Finitions */
.label { color: var(--ink); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; }
.note, .sound-tag { border-radius: 4px; }
.note { border-color: var(--rule); }
.note.root { background: var(--accent); color: #fff; border-color: var(--accent); }
.sound-tag { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
.sound-tag::before { background: #fff; }
.pad { border-color: var(--rule); }
.pad .ch b { font-weight: 700; }
.seg.grid { gap: 0; padding: 0; overflow: hidden; }
.seg.grid button { border-radius: 0; border-left: 1px solid var(--rule); padding: 9px 0; }
.seg.grid button:first-child { border-left: 0; }
.keys button:nth-child(7) { border-left: 0; }
.keys button:nth-child(n+7) { border-top: 1px solid var(--rule); }
.seg.modes { padding: 0; gap: 0; overflow: hidden; }
.seg.modes button { border-radius: 0; }
.seg.modes button + button { border-top: 1px solid var(--rule); }
.soundpanel .seg.grid { border-radius: var(--radius-btn); }
.soundpanel .seg.grid button { border-left-width: 0; border-radius: var(--radius-btn); }
.bar { box-shadow: 0 6px 20px rgba(20, 22, 40, .12); }
.slot-del.confirm { color: #c8102e; }
/* Version aérée : filets clairs, pastilles espacées, titres discrets, plus d'espace */
:root { --line: #e3e5ea; --rule: #eceef2; --bw: 1px; --display-weight: 650; --bg: #fafafb; }
.app { gap: 22px; padding-block: 14px 32px; }
.controls { gap: 10px; }
.label { color: var(--muted); font-weight: 500; letter-spacing: 0.05em; font-size: 0.68rem; }
.seg, .seg.grid, .seg.modes { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 3px; gap: 2px; box-shadow: 0 1px 2px rgba(20, 22, 40, .04); }
.seg.grid button, .seg.modes button, .seg button { border: 0 !important; border-radius: 7px; color: var(--muted); font-weight: 500; }
.keys { row-gap: 2px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 600; }
.seg.modes button + button { border-top: 0 !important; }
.now { gap: 14px; }
.note { border-color: var(--line); background: var(--surface); }
.tile { border-color: var(--line); border-radius: 10px; box-shadow: 0 1px 2px rgba(20, 22, 40, .04); }
.tile.instru { background: var(--surface); border-color: var(--line); }
.tile.instru .tile-top { color: var(--muted); }
.tile.instru select { color: var(--accent); }
.tile.instru select:focus-visible { outline-color: var(--accent); }
.tile.instru::after { border-color: var(--accent); }
.pad { border-color: var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(20, 22, 40, .04); }
.pads { gap: 10px; }
.pads.suite { gap: 8px; }
.pads.suite .pad { border: 0; border-radius: 12px; box-shadow: 0 4px 14px rgba(47, 79, 216, .22); }
.pads.suite .pad.held { box-shadow: none; }
.pad .ch b { font-weight: 650; }
.bar { border-color: var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(20, 22, 40, .10); }
.bar button { border-radius: 10px; }
#share { border-color: var(--line); background: var(--surface); }
.slot, .empty { border-top-color: var(--line); }

.notes.idle .note.root { color: #fff; }

/* Haut repliable : une ligne de résumé toujours visible, le style et la tonalité dessous */
.picker { display: flex; flex-direction: column; }
.picker-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; box-shadow: 0 1px 2px rgba(20, 22, 40, .04); }
.ph-sum { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-sum b { font-weight: 650; }
.ph-logo { flex: none; width: 20px; height: 20px; align-self: center; margin-right: 2px; }
.ph-sum span { color: var(--muted); }
.ph-act { flex: none; display: flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 500; color: var(--accent); }
.chev { flex: none; margin: 0 2px; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(2px) rotate(-135deg); transition: transform .2s; }
.picker.closed .chev { transform: translateY(-2px) rotate(45deg); }
.collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .22s ease, opacity .22s ease; }
.collapse-in { overflow: hidden; min-height: 0; }
.collapse-in .controls { padding-top: 10px; }
.picker.closed .collapse { grid-template-rows: 0fr; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .collapse, .chev { transition: none; } }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); font-size: 0.86rem; padding: 9px 14px; border-radius: var(--radius-btn); z-index: 40; text-align: center; }
@media (prefers-reduced-motion: reduce) { .pad { transition: none; } .pad.held { transform: none; } }
</style>
<style>
/* Base : marges des encoches de l'iPhone, et l'attribut hidden toujours respecté */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <section class="picker">
    <button class="picker-head" id="pickerHead" type="button" aria-expanded="true" aria-controls="pickerBody">
      <span class="ph-sum"><svg class="ph-logo" viewBox="0 0 64 64" role="img" aria-label="Vamp"><rect width="64" height="64" rx="14" fill="#2f4fd8"/><g stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"><line x1="8" y1="18" x2="56" y2="18"/><line x1="8" y1="25" x2="56" y2="25"/><line x1="8" y1="32" x2="56" y2="32"/><line x1="8" y1="39" x2="56" y2="39"/><line x1="8" y1="46" x2="56" y2="46"/></g><g fill="#ffffff"><ellipse cx="13.5" cy="18" rx="4.6" ry="3.3" transform="rotate(-20 13.5 18)"/><ellipse cx="22.75" cy="32" rx="4.6" ry="3.3" transform="rotate(-20 22.75 32)"/><ellipse cx="41.25" cy="32" rx="4.6" ry="3.3" transform="rotate(-20 41.25 32)"/><ellipse cx="50.5" cy="18" rx="4.6" ry="3.3" transform="rotate(-20 50.5 18)"/></g><ellipse cx="32" cy="46" rx="4.6" ry="3.3" transform="rotate(-20 32 46)" fill="#1d1e22"/></svg><b id="sumStyle"></b><span id="sumKey"></span></span>
      <span class="ph-act"><span id="phLabel">Hide</span><i class="chev" aria-hidden="true"></i></span>
    </button>
    <div class="collapse" id="pickerBody">
      <div class="collapse-in">
        <div class="controls">
          <div class="seg grid styles" id="styles" role="group" aria-label="Style"></div>
          <div class="keyrow">
            <div class="seg grid keys" id="keys" role="group" aria-label="Key"></div>
            <div class="seg modes" id="modes" role="group" aria-label="Mode">
              <button type="button" data-mode="maj">Maj</button>
              <button type="button" data-mode="min">Min</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="now">
    <div class="now-main" aria-live="polite">
      <div class="now-name idle" id="nowName">—</div>
      <div class="notes" id="nowNotes"></div>
    </div>
    <div class="tiles" id="sound" role="group" aria-label="Sound"></div>
  </section>

  <section aria-label="Suggested progression">
    <div class="pads suite" id="suite"></div>
  </section>

  <section>
    <p class="label">More chords in this style</p>
    <div class="pads" id="pads"></div>
  </section>

  <section>
    <div class="prow">
      <span class="label">Note names</span>
      <div class="seg" id="nota" role="group" aria-label="Note names">
        <button type="button" data-fr="0">C D E</button>
        <button type="button" data-fr="1">Do Ré Mi</button>
      </div>
    </div>
  </section>

  <div class="bar">
    <button id="share" type="button"><svg class="share-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Share MIDI</button>
    <button id="gen" type="button">Generate</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- Théorie ----------
  const Q = {
    maj:{iv:[0,4,7],sym:'',rn:''}, m:{iv:[0,3,7],sym:'m',rn:''},
    '7':{iv:[0,4,7,10],sym:'7',rn:'7'}, maj7:{iv:[0,4,7,11],sym:'maj7',rn:'maj7'},
    m7:{iv:[0,3,7,10],sym:'m7',rn:'7'}, '9':{iv:[0,4,7,10,14],sym:'9',rn:'9'},
    maj9:{iv:[0,4,7,11,14],sym:'maj9',rn:'maj9'}, m9:{iv:[0,3,7,10,14],sym:'m9',rn:'9'},
    m11:{iv:[0,3,7,10,14,17],sym:'m11',rn:'11'}, '13':{iv:[0,4,10,14,21],sym:'13',rn:'13'},
    sus4:{iv:[0,5,7,10],sym:'7sus4',rn:'7sus4'}, '69':{iv:[0,4,7,9,14],sym:'6(9)',rn:'6(9)'},
    '7b9':{iv:[0,4,7,10,13],sym:'7♭9',rn:'7♭9'}, m7b5:{iv:[0,3,6,10],sym:'m7♭5',rn:'ø7'},
    '7#9':{iv:[0,4,7,10,15],sym:'7♯9',rn:'7♯9'}, '9sus4':{iv:[0,5,7,10,14],sym:'9sus4',rn:'9sus4'},
    'maj7#11':{iv:[0,4,7,11,18],sym:'maj7♯11',rn:'maj7♯11'}, m6:{iv:[0,3,7,9],sym:'m6',rn:'6'},
    add9:{iv:[0,4,7,14],sym:'add9',rn:'add9'}, dim:{iv:[0,3,6,9],sym:'°7',rn:'°7'}
  };
  // Suites par style et par mode. Notation : degré:couleur, @degré = basse différente (accord sur basse).
  // Les 12 « autres accords » sont déduits des suites du style (les plus fréquents), triés par degré.
  const STYLES = {
    rnb:{name:'R&B', bpm:72,
      maj:{ progs:[
        'IV:maj9 iii:m7 ii:m9 I:maj9',
        'I:maj9 iii:m7 IV:maj9 IV:maj9@V',

      out.connect(conv); conv.connect(wet); wet.connect(comp);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.03), ctx.sampleRate);
      { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); }
      const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
      applyKnobs();
    }
    return ctx.state === 'running' ? Promise.resolve() : ctx.resume().catch(() => {});
  }
  const voicesAlive = new Set();
  function applyKnobs() {
    if (!ctx) return;
    const c = st.k.chorus, t = ctx.currentTime, share = PRESETS[st.sound].chorus;
    chorusWet.gain.setTargetAtTime(c < 0.05 || share === 0 ? 0 : (0.4 + c * 0.5) * share, t, 0.05);
    lfoGain.gain.setTargetAtTime(0.0012 + c * 0.0025, t, 0.05);
    voicesAlive.forEach(v => v.f.frequency.setTargetAtTime(Math.min(18000, cutoffHz(st.k.cutoff) * v.fMul), t, 0.03));
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  // Courbe de saturation douce (tanh), mise en cache
  const curves = {};
  function driveCurve(k) {
    if (curves[k]) return curves[k];
    const n = 1024, c = new Float32Array(n), norm = Math.tanh(k);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / norm; }
    return (curves[k] = c);
  }
  function voice(m, t, vel, bass) {
    const P = PRESETS[st.sound];
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    const fMul = P.fMul * (bass ? 0.5 : 1);
    const fc = Math.min(18000, cutoffHz(st.k.cutoff) * fMul);
    f.type = 'lowpass'; f.Q.value = bass ? Math.min(P.q, 2) : P.q;
    f.frequency.setValueAtTime(Math.min(18000, fc * P.env), t); f.frequency.setTargetAtTime(fc, t + 0.01, Math.max(0.06, P.dec * 0.8));
    const oscs = [], freq = mtof(m);
    if (P.fm) {
      // Synthèse FM : une sinus porteuse modulée ; l'indice retombe vite pour l'attaque
      const F = P.fm;
      let dest = f;
      if (F.drive) {
        const sh = ctx.createWaveShaper(); sh.curve = driveCurve(F.drive); sh.oversample = '2x';
        sh.connect(f); dest = sh;
      }
      const sine = (fr, gain, type = 'sine') => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = type; o.frequency.value = fr; og.gain.value = gain; o.connect(og); og.connect(dest); oscs.push(o); return o;
      };
      const car = sine(freq, F.car);
      const mod = ctx.createOscillator(), mg = ctx.createGain();
      mod.type = 'sine'; mod.frequency.value = freq * (bass ? 1 : F.ratio);
      mg.gain.setValueAtTime(freq * F.index * (bass ? 0.8 : 1), t); mg.gain.setTargetAtTime(freq * 0.02, t, F.idxTc);
      mod.connect(mg); mg.connect(car.frequency); oscs.push(mod);
      if (F.bark) {
        // « Grognement » : 2e modulateur au même ratio, qui retombe plus lentement
        const bark = ctx.createOscillator(), bg = ctx.createGain();
        bark.type = 'sine'; bark.frequency.value = freq;
        bg.gain.setValueAtTime(freq * F.bark * (bass ? 0.4 : 1), t); bg.gain.setTargetAtTime(freq * F.barkFloor, t, F.barkTc);
        bark.connect(bg); bg.connect(car.frequency); oscs.push(bark);
      }
      if (F.body) sine(freq, F.body);                 // corps : fondamentale pure
      if (F.sub && !bass) sine(freq / 2, F.sub);      // un peu de grave sous la note
      if (F.oct) sine(freq * 2, F.oct);
    } else {
      (bass ? P.osc.slice(0, 2) : P.osc).forEach(([type, det, gain, mult]) => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = type; o.frequency.value = freq * mult; o.detune.value = det; og.gain.value = gain;
        o.connect(og); og.connect(f); oscs.push(o);
      });
    }
    // Vibrato (cordes, orgue) : un LFO par voix module la hauteur
    if (P.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = P.vib.rate * (0.97 + Math.random() * 0.06);
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(P.vib.cents, t + 0.35);
      l.connect(lg);
      oscs.forEach(o => { if (o.detune) lg.connect(o.detune); });
      oscs.push(l);
    }
    // Trémolo (Rhodes, orgue) : le volume oscille
    let last = f;
    if (P.trem && !bass) {
      const tg = ctx.createGain(), l = ctx.createOscillator(), lg = ctx.createGain();
      tg.gain.value = 1 - P.trem.depth / 2;
      l.frequency.value = P.trem.rate; lg.gain.value = P.trem.depth / 2;
      l.connect(lg); lg.connect(tg.gain); f.connect(tg); last = tg; oscs.push(l);
    }
    last.connect(g); g.connect(input);
    // Clic de touche d'orgue
    if (P.click && !bass && noiseBuf) {
      const n = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), ng = ctx.createGain();
      n.buffer = noiseBuf; hp.type = 'bandpass'; hp.frequency.value = 2500; hp.Q.value = 0.8; ng.gain.value = vel * 0.6;
      n.connect(hp); hp.connect(ng); ng.connect(input); n.start(t);
    }
    const peak = vel * P.lvl;
    g.gain.setValueAtTime(0.0001, t);
    if (P.a > 0.05) g.gain.linearRampToValueAtTime(peak, t + P.a); else g.gain.exponentialRampToValueAtTime(peak, t + P.a);
    g.gain.setTargetAtTime(Math.max(0.0002, peak * P.sus), t + P.a, P.dec);
    oscs.forEach(o => o.start(t));
    const v = { g, f, oscs, bass, fMul, minRel: P.minRel || 0, done: false };
    voicesAlive.add(v);
    return v;
  }
  function release(v) {
    if (v.done) return; v.done = true;
    const now = ctx.currentTime, rel = Math.max(releaseS(st.k.release), v.minRel);
    v.g.gain.cancelScheduledValues(now); v.g.gain.setValueAtTime(Math.max(0.0001, v.g.gain.value), now);
    v.g.gain.setTargetAtTime(0.0001, now, rel / 4);
    v.oscs.forEach(o => { try { o.stop(now + rel + 0.1); } catch (e) {} });
    setTimeout(() => { voicesAlive.delete(v); try { v.g.disconnect(); } catch (e) {} }, (rel + 0.2) * 1000);
  }

  // ---------- Jeu : tenir une touche ----------
  const held = new Map();
  function padOn(pad) {
    if (held.has(pad)) return;
    const c = info(pad.dataset.tok);
    pad.classList.add('held'); showChord(c);
    const h = { voices: [] }; held.set(pad, h);
    ensureAudio().then(() => {
      if (held.get(pad) !== h) return;
      const notes = voicing[c.tok] || voiceAfter(null, c);
      const t = ctx.currentTime + 0.005, vel = 0.3 / Math.sqrt(notes.length);
      h.voices.push(voice(c.bass, t, 0.22, true));
      notes.forEach(m => h.voices.push(voice(m, t, vel, false)));
    });
  }
  function padOff(pad) {
    const h = held.get(pad); if (!h) return;
    held.delete(pad); pad.classList.remove('held');
    if (ctx) h.voices.forEach(release);
  }
  const padOf = e => e.target.closest('.pad');
  const up = e => { const pad = padOf(e); if (pad && pad.dataset.pid == e.pointerId) padOff(pad); };
  ['suite', 'pads'].forEach(id => {
    const box = $(id);
    box.addEventListener('pointerdown', e => {
      const pad = padOf(e); if (!pad) return;
      try { pad.setPointerCapture(e.pointerId); } catch (_) {}
      pad.dataset.pid = e.pointerId; padOn(pad);
    });
    box.addEventListener('pointerup', up);
    box.addEventListener('pointercancel', up);
    box.addEventListener('lostpointercapture', up);
    box.addEventListener('contextmenu', e => { if (padOf(e)) e.preventDefault(); });
    box.addEventListener('keydown', e => { const pad = padOf(e); if (pad && (e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); padOn(pad); } });
    box.addEventListener('keyup', e => { const pad = padOf(e); if (pad && (e.key === ' ' || e.key === 'Enter')) padOff(pad); });
  });
  const releaseAll = () => [...held.keys()].forEach(padOff);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  // ---------- MIDI : la suite en accords plaqués, une mesure par accord, tempo fixe ----------
  const MIDI_BPM = 110;
  function vlq(n) { const out = [n & 0x7f]; while ((n >>= 7)) out.unshift((n & 0x7f) | 0x80); return out; }
  function track(events) {
    events.sort((a, b) => a.tick - b.tick || a.order - b.order);
    const bytes = []; let last = 0;
    events.forEach(e => { bytes.push(...vlq(e.tick - last), ...e.data); last = e.tick; });
    bytes.push(0, 0xff, 0x2f, 0);
    const len = bytes.length;
    return [0x4d,0x54,0x72,0x6b, (len>>>24)&255, (len>>>16)&255, (len>>>8)&255, len&255, ...bytes];
  }
  const asciiBytes = s => Array.from(s).map(ch => ch.charCodeAt(0) & 0x7f);
  function buildMidi() {
    const PPQ = 480, us = Math.round(60000000 / MIDI_BPM);
    const t0 = [{ tick: 0, order: 0, data: [0xff, 0x51, 3, (us>>16)&255, (us>>8)&255, us&255] }, { tick: 0, order: 0, data: [0xff, 0x58, 4, 4, 2, 24, 8] }];
    const n1 = asciiBytes('Accords'), n2 = asciiBytes('Basse');
    const ce = [{ tick: 0, order: 0, data: [0xff, 0x03, n1.length, ...n1] }], be = [{ tick: 0, order: 0, data: [0xff, 0x03, n2.length, ...n2] }];
    const vs = voiceSuite(st.prog);
    st.prog.forEach((tok, bar) => {
      const c = info(tok), on = bar * 4 * PPQ, off = on + 4 * PPQ - 20;
      vs[bar].forEach(m => { ce.push({ tick: on, order: 2, data: [0x90, m, 80] }); ce.push({ tick: off, order: 1, data: [0x80, m, 0] }); });
      be.push({ tick: on, order: 2, data: [0x91, c.bass, 95] }); be.push({ tick: off, order: 1, data: [0x81, c.bass, 0] });
    });
    const head = [0x4d,0x54,0x68,0x64, 0,0,0,6, 0,1, 0,3, (PPQ>>8)&255, PPQ&255];
    return new Uint8Array([...head, ...track(t0), ...track(ce), ...track(be)]);
  }
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  function zipOne(filename, data) {
    const fn = new TextEncoder().encode(filename), crc = crc32(data), size = data.length;
    const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
    const local = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(fn.length), ...u16(0)];
    const localLen = local.length + fn.length + size;
    const central = [...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(fn.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(0)];
    const centralLen = central.length + fn.length;
    const end = [...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(1), ...u16(1), ...u32(centralLen), ...u32(localLen), ...u16(0)];
    const out = new Uint8Array(localLen + centralLen + end.length); let p = 0;
    const put = a => { out.set(a, p); p += a.length; };
    put(local); put(fn); put(data); put(central); put(fn); put(end);
    return out;
  }
  const fileBase = () => `${STYLES[st.style].name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace('&','n')}_${FLAT[st.key]}${st.mode === 'min' ? 'm' : ''}_${MIDI_BPM}bpm_${st.prog.map(t => info(t).ascii).join('-')}`.replace(/[^A-Za-z0-9_\-]/g, '');

  // ---------- Partage du fichier MIDI ----------
  // 1) menu de partage du téléphone (AirDrop, Messages, Fichiers…), 2) dans Claude : téléchargement, 3) sinon : fichier .mid
  let downloads = null;
  (async () => { try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; } })();
  function downloadBlob(name, blob) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
  async function shareMidi() {
    const base = fileBase(), bytes = buildMidi();
    let file = null;
    try { file = new File([bytes], base + '.mid', { type: 'audio/midi' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: base + '.mid' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    if (downloads) {
      try { await downloads.save({ filename: base + '.zip', data: new Blob([zipOne(base + '.mid', bytes)]) }); toast('Open the .zip in Files, then import the .mid', 4500); }
      catch (err) { if (!err || err.code !== 'declined') toast(err && err.code === 'rate_limited' ? 'An export is already running' : 'Could not share here'); }
      return;
    }
    downloadBlob(base + '.mid', new Blob([bytes], { type: 'audio/midi' })); toast('MIDI file ready');
  }

  let toastT;
  function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

  // ---------- Événements ----------
  $('styles').addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b || b.dataset.s === st.style) return;
    releaseAll(); st.style = b.dataset.s; st.mode = DEFAULT_MODE[st.style]; newProg(true); savePrefs(); renderSelectors(); renderPads(); showChord(null);
  });
  $('keys').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    releaseAll(); st.key = +b.dataset.k; savePrefs(); renderSelectors(); renderPads(); showChord(null);
  });
  $('modes').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]'); if (!b || b.dataset.mode === st.mode) return;
    releaseAll(); st.mode = b.dataset.mode; newProg(true); savePrefs(); renderSelectors(); renderPads(); showChord(null);
  });
  $('sound').addEventListener('change', e => {
    if (e.target.id !== 'snd') return;
    releaseAll(); st.sound = e.target.value; savePrefs(); applyKnobs();
  });
  $('gen').onclick = () => { releaseAll(); newProg(false); renderPads(); showChord(null); };
  $('share').onclick = shareMidi;
  $('nota').addEventListener('click', e => {
    const b = e.target.closest('[data-fr]'); if (!b) return;
    st.fr = b.dataset.fr === '1'; savePrefs(); renderAll();
  });

  // ---------- Haut repliable ----------
  let pickerClosed = false;
  try { pickerClosed = localStorage.getItem('atelier-accords-picker') === 'closed'; } catch (e) {}
  function applyPicker() {
    document.querySelector('.picker').classList.toggle('closed', pickerClosed);
    $('pickerHead').setAttribute('aria-expanded', String(!pickerClosed));
    $('phLabel').textContent = pickerClosed ? 'Edit' : 'Hide';
    $('pickerBody').inert = pickerClosed;
  }
  $('pickerHead').addEventListener('click', () => {
    pickerClosed = !pickerClosed; applyPicker();
    try { localStorage.setItem('atelier-accords-picker', pickerClosed ? 'closed' : 'open'); } catch (e) {}
  });
  applyPicker();

  newProg(true); renderAll();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
